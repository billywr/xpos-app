<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="250" fill="url(#bgGrad)" />

  <!-- Center Ambient Radial Glow -->
  <ellipse cx="200" cy="115" rx="140" ry="90" fill="url(#amberGlow)" />

  <!-- Subtle Decorative Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="180" x2="400" y2="180" />
    <circle cx="200" cy="115" r="70" fill="none" stroke-dasharray="4,4" />
  </g>

  <!-- Product Silhouette Group -->
  <g transform="translate(200, 115)">
    <!-- Plate / Serving Board Shadow -->
    <ellipse cx="0" cy="45" rx="75" ry="12" fill="#000000" fill-opacity="0.4" />

    <!-- Wine / Cocktail Glass (Left) -->
    <g transform="translate(-40, 0)">
      <!-- Bowl -->
      <path d="M-14,-25 Q-14,5 0,10 Q14,5 14,-25 Z" fill="url(#glassGrad)" stroke="#cbd5e1" stroke-opacity="0.4" stroke-width="1.5" />
      <!-- Liquid Fill -->
      <path d="M-11,-10 Q-11,4 0,8 Q11,4 11,-10 Z" fill="url(#accentGrad)" fill-opacity="0.8" />
      <!-- Stem & Base -->
      <line x1="0" y1="10" x2="0" y2="35" stroke="#cbd5e1" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round" />
      <ellipse cx="0" cy="36" rx="12" ry="3" fill="#cbd5e1" fill-opacity="0.4" />
    </g>

    <!-- Beer Pint / Bottle (Center) -->
    <g transform="translate(0, -8)">
      <!-- Bottle Body -->
      <path d="M-10,-40 L-10,-30 L-16,-10 L-16,38 Q-16,42 -12,42 L12,42 Q16,42 16,38 L16,-10 L10,-30 L10,-40 Z" fill="url(#glassGrad)" stroke="#e2e8f0" stroke-opacity="0.5" stroke-width="1.5" />
      <!-- Golden Beverage Core -->
      <rect x="-13" y="-5" width="26" height="42" rx="3" fill="url(#accentGrad)" fill-opacity="0.85" />
      <!-- Foam / Crown -->
      <rect x="-13" y="-8" width="26" height="6" rx="2" fill="#ffffff" fill-opacity="0.9" />
      <!-- Bottle Neck Ring -->
      <rect x="-11" y="-40" width="22" height="4" rx="1" fill="#f59e0b" />
    </g>

    <!-- Fork & Knife Motif (Right) -->
    <g transform="translate(42, 2)">
      <!-- Cocktail Shaker / Tumbler -->
      <path d="M-12,-22 L-9,35 Q-9,38 -5,38 L5,38 Q9,38 9,35 L12,-22 Z" fill="url(#glassGrad)" stroke="#cbd5e1" stroke-opacity="0.4" stroke-width="1.5" />
      <path d="M-8,5 L-7,34 L7,34 L8,5 Z" fill="url(#accentGrad)" fill-opacity="0.75" />
      <!-- Ice cubes reflection -->
      <rect x="-4" y="8" width="8" height="8" rx="1.5" fill="#ffffff" fill-opacity="0.4" transform="rotate(15)" />
    </g>
  </g>

  <!-- Elegant Stone Pub Brand Stamp Badge -->
  <g transform="translate(200, 205)">
    <rect x="-65" y="-14" width="130" height="24" rx="12" fill="#1e293b" fill-opacity="0.85" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="-48" cy="-2" r="3" fill="#f59e0b" />
    <text x="5" y="2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f8fafc" letter-spacing="1.5" text-anchor="middle">
      STONE PUB
    </text>
    <circle cx="48" cy="-2" r="3" fill="#f59e0b" />
  </g>
</svg>
