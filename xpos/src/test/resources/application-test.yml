# Profile for integration tests (Testcontainers). Datasource URL is set via @DynamicPropertySource.
spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate

xpos:
  mpesa:
    callback-url: https://example.com/api/v1/integrations/mpesa/stk/callback
