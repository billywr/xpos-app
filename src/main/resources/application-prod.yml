# Production profile. Externalized via env vars (SPRING_DATASOURCE_URL, SPRING_DATA_REDIS_HOST, etc.)
spring:
  application:
    name: xpos

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  cache:
    type: redis

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${XPOS_KEYCLOAK_JWK_URI}

server:
  port: 9003
  shutdown: graceful
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  health:
    redis:
      enabled: true
    db:
      enabled: true

logging:
  level:
    root: INFO
    org.springframework.security: WARN
    com.blinc.xpos: INFO

xpos:
  environment: prod
  api:
    pagination:
      default-size: 25
      max-size: 200
