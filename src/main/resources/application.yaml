spring:
  profiles:
    active: dev

logging:
  level:
    org.springframework.orm.jpa: DEBUG
    org.springframework.boot.autoconfigure.orm.jpa: DEBUG
    org.hibernate: INFO

xpos:
  assistant:
    rate-limit-per-hour: 30
    llm:
      enabled: false
      api-key: ""
      base-url: https://api.openai.com/v1
      model: gpt-4o-mini
      max-tokens-per-day-per-org: 5000
    insights:
      enabled: true
      cron: "0 0 */4 * * *"
