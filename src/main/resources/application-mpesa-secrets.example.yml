# Copy to application-mpesa-secrets.yml (gitignored) for local Daraja sandbox.
# Update callback-url whenever ngrok restarts (free plan gets a new subdomain).
xpos:
  mpesa:
    consumer-key: YOUR_DARAJA_CONSUMER_KEY
    consumer-secret: YOUR_DARAJA_CONSUMER_SECRET
    callback-url: https://YOUR-SUBDOMAIN.ngrok-free.dev/api/v1/integrations/mpesa/stk/callback
