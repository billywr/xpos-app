name: XPOS CI/CD - UI

on:
  push:
    branches: [main, master]
    paths:
      - 'xpos-ui/**'
      - '.github/workflows/xpos-ci-cd-ui.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'xpos-ui/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-ui:
    name: Build and Push UI Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercased image name
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/xpos-ui"
          echo "IMAGE_REPOSITORY=${IMAGE_NAME,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REPOSITORY }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=raw,value=dev
            type=ref,event=branch
            type=sha,format=short

      - name: Build and push UI Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./xpos-ui
          file: ./xpos-ui/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
            VITE_KEYCLOAK_URL=${{ secrets.VITE_KEYCLOAK_URL }}
            VITE_KEYCLOAK_REALM=${{ vars.VITE_KEYCLOAK_REALM }}
            VITE_KEYCLOAK_CLIENT_ID=${{ vars.VITE_KEYCLOAK_CLIENT_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-ui:
    name: Deploy UI to Server
    needs: build-and-push-ui
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Deploy to Remote Server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          timeout: 60s
          command_timeout: 15m
          script_stop: true
          script: |
            echo "==> Deploying xpos-ui to server..."
            cd /app
            docker compose pull xpos-ui
            docker compose up -d --no-deps xpos-ui
            docker image prune -f
            echo "==> xpos-ui deployment complete:"
            docker compose ps xpos-ui
