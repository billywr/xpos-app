# CI/CD pipeline for XPOS API service (xpos-api)
name: XPOS CI/CD - API

on:
  push:
    branches: [main, master]
    paths:
      - 'xpos/**'
      - '.github/workflows/xpos-ci-cd-api.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'xpos/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-api:
    name: Build and Push API Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercased image name
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/xpos"
          echo "IMAGE_REPOSITORY=${IMAGE_NAME,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REPOSITORY }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=raw,value=dev
            type=ref,event=branch
            type=sha,format=short

      - name: Build and push API Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./xpos
          file: ./xpos/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-api:
    name: Deploy API to Server
    needs: build-and-push-api
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Deploy to Remote Server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          timeout: 60s
          command_timeout: 15m
          script_stop: true
          script: |
            echo "==> Deploying xpos-api to server..."
            cd /app
            docker compose pull xpos-api
            docker compose up -d --no-deps xpos-api
            docker image prune -f
            echo "==> xpos-api deployment complete:"
            docker compose ps xpos-api
